
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wi-Fi Network</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #241307;
    min-height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.screen {
    position: relative;
    width: min(100vw, 177.8646vh);
    aspect-ratio: 1366 / 768;
    overflow: hidden;
}

.background {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
    user-select: none;
    pointer-events: none;
}

/* Password textbox */
.password-wrap {
    position: absolute;
    left: 34.38%;
    top: 53.52%;
    width: 28.22%;
    height: 3.78%;
}

#password {
    width: 100%;
    height: 100%;
    padding: 0 10px;
    border: none;
    border-bottom: 1px solid #596078;
    border-radius: 4px 4px 0 0;
    outline: none;
    background: #f2f0f2;
    color: #24212a;
    font: 12px Roboto, Arial, sans-serif;
}

#password:focus {
    border-bottom: 2px solid #53658f;
}

/* Invisible password toggle */
.eye {
    position: absolute;
    left: 64.25%;
    top: 53.15%;
    width: 2.2%;
    height: 4.1%;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
}

.eye svg {
    visibility: hidden;
}

/* Connect button */
.connect {
    position: absolute;

    /* Slightly adjusted alignment */
    left: 60.55%;
    top: 65.75%;

    width: 5.35%;
    height: 3.85%;

    border: none;
    border-radius: 4px;

    font-family: Roboto, "Arial", sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0;
    text-align: center;

    display: flex;
    justify-content: center;
    align-items: center;

    transition: background 0.15s ease, color 0.15s ease;
}

/* Disabled */
.connect:disabled {
    background: #e3e1e4;
    color: #99979b;
    cursor: not-allowed;
}

/* Enabled */
.connect:not(:disabled) {
    background: #6255a4;
    color: #ffffff;
    cursor: pointer;
}

</style>
</head>

<body>

<main class="screen">

    <!-- Original background -->
    <img
        class="background"
        src="/static/Screenshot 2026-11-06 4.02.03 PM.png"
        alt="Wi-Fi screen"
    >

    <!-- Password input -->
    <div class="password-wrap">
        <input
            id="password"
            type="password"
            autocomplete="new-password"
            spellcheck="false"
        >
    </div>

    <!-- Invisible clickable button -->
    <button
        class="eye"
        id="togglePassword"
        type="button"
        aria-label="Show password"
    >
        <svg viewBox="0 0 24 24"></svg>
    </button>

    <!-- Connect button -->
    <button
        class="connect"
        id="connectButton"
        type="button"
        disabled
    >
        Connect
    </button>

</main>

<script>

const passwordInput = document.getElementById("password");
const toggleButton = document.getElementById("togglePassword");
const connectButton = document.getElementById("connectButton");

// Enable Connect after 4 characters
passwordInput.addEventListener("input", function() {
    connectButton.disabled = passwordInput.value.length <= 4;
});

// Toggle password visibility
toggleButton.addEventListener("click", function() {

    const reveal = passwordInput.type === "password";

    passwordInput.type = reveal ? "text" : "password";

    toggleButton.setAttribute(
        "aria-label",
        reveal ? "Hide password" : "Show password"
    );

});

</script>

</body>
</html>
